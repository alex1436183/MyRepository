replicaCount: 2

image:
  repository: alex1436183/my-app
  tag: latest
  pullPolicy: IfNotPresent

service:
  name: my-app-service
  type: LoadBalancer       
  port: 5001
  targetPort: 5000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: my-app.local
      paths:
        - /
  tls: []

resources: {}

namespace: default  
